## MetaScience conda environment — modernized, mutually consistent pins.
##
## The original environment.yml pinned python=3.7.9 / numpy=1.19.2, which cannot
## run current astropy; mixing an old env with a newer numpy is what broke on
## canfar. This spec pins the three compatibility-critical packages exactly
## (numpy / scipy / astropy) and leaves the rest flexible so the solve doesn't
## fail on a version that happens not to exist as a conda-forge build.
##
## Create it with:
##     conda env create -f environment.yml
##     conda activate metascience
##
## (Delete an old copy first if needed:  conda env remove -n metascience)

name: metascience
channels:
  - conda-forge
dependencies:
  # Compatibility-critical: astropy 6.1.x must pair with numpy 2.0-2.2.
  - python=3.11
  - numpy=2.2.6
  - scipy=1.14.1
  - astropy=6.1.7
  # Flexible — let conda pick compatible builds:
  - matplotlib
  - pyyaml
  - dill
  - ipython
  - ipykernel
  - jupyter
  - pip
  - pip:
      - glob2==0.7
      - ipdb
